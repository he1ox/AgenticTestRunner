# Example: gate a pipeline on a qa-runner Test plan. Copy to .github/workflows/qa-replay.yml in
# the project that holds .qa/ (config, tests, suites) and change the suite id, secrets and app.
#
# The saved scripts replay deterministically: no agent, no model, no tokens. The job fails when a
# case ends fail or blocked (--fail-on), the run folder (screenshots, marks, videos, results) is
# uploaded as an artifact, and the JUnit report shows up as a check on the commit.
name: qa-replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # the JUnit report is published as a check run

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # qa-runner itself: pin a tag or commit. If the skills are committed in your repo (for
      # example under .claude/skills/ after `npx skills add … --copy`), skip this step and point
      # QA_CLI at that copy's run-test-plan/scripts/qa-runs.mjs instead.
      - uses: actions/checkout@v4
        with:
          repository: he1ox/AgenticTestRunner
          ref: main
          path: .qa-runner

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright MCP drives Google Chrome by default, which ubuntu-latest already has. On other
      # runners: npx -y playwright install --with-deps chrome
      # ffmpeg is optional: without it recordings are skipped and everything else still replays.
      - name: ffmpeg for recordings
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The scripts replay against the URLs they were recorded on. If that is a local app, start
      # it here (in the background) and wait until it answers.
      # - name: Start the app
      #   run: npm ci && (npm start &) && npx -y wait-on http://localhost:3000

      - name: Replay the smoke Test plan
        env:
          QA_CLI: .qa-runner/skills/run-test-plan/scripts/qa-runs.mjs
          # One variable per account secret (`env:NAME` in .qa/config.json → execution.accounts),
          # or QA_PASSWORD. A missing one stops the job before any browser starts.
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: node "$QA_CLI" suite run smoke --ci --fail-on fail,blocked --junit qa-junit.xml

      - name: Upload the run (evidence, results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-run
          path: .qa/runs/
          if-no-files-found: ignore

      - name: Publish the JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: qa-junit.xml
          check_name: qa-runner replay
