name: pr title

# Pull requests are squash-merged, so the title becomes the commit on main: it must follow
# Conventional Commits (https://www.conventionalcommits.org), like the history already does.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{0,98}$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::\"$TITLE\" is not a Conventional Commit. Use type(scope): summary, e.g. \"fix(viewer): keep marks when a screenshot is replaced\". Types: feat fix docs style refactor perf test build ci chore revert."
            exit 1
          fi
