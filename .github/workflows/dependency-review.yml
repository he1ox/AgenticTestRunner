name: dependency review

# qa-runner has no npm dependencies, so this mostly guards the workflows: a pull request that adds
# or bumps an action with a known vulnerability fails here. A new package.json with dependencies
# also shows up, which AGENTS.md does not allow.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
